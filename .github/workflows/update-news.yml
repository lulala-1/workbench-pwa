name: Update Hot News

on:
  schedule:
    # 每30分钟抓取一次（UTC时间）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Baidu Hot News
        run: |
          python3 -c "
          import re, json, urllib.request

          # 抓取百度实时热搜
          url = 'https://top.baidu.com/board?tab=realtime'
          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          })
          html = urllib.request.urlopen(req, timeout=15).read().decode('utf-8')

          # 提取标题和热度
          data = re.findall(r'\"query\":\s*\"([^\"]+)\".*?\"hotScore\":\s*\"?(\d+)', html)
          hot_list = [{'title': q, 'hot': h} for q, h in data[:30]]

          # 抓取百度民生热搜
          url2 = 'https://top.baidu.com/board?tab=realtime'
          # 也试试看其他 tab
          url3 = 'https://top.baidu.com/board?tab=douyin'
          try:
              req3 = urllib.request.Request(url3, headers={
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
              })
              html3 = urllib.request.urlopen(req3, timeout=15).read().decode('utf-8')
              data3 = re.findall(r'\"query\":\s*\"([^\"]+)\".*?\"hotScore\":\s*\"?(\d+)', html3)
              social_list = [{'title': q, 'hot': h} for q, h in data3[:30]]
          except:
              social_list = hot_list[15:30] if len(hot_list) > 15 else hot_list

          result = {
              'hot': hot_list,
              'social': social_list,
              'updated': __import__('datetime').datetime.now().strftime('%Y-%m-%d %H:%M')
          }

          with open('news.json', 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          print(f'Updated: {len(hot_list)} hot, {len(social_list)} social')
          "

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "auto: update hot news [skip ci]"
          git push
